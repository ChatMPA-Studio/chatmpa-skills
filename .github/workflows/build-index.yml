name: Build skills catalog

# On pull requests: validate frontmatter only.
# On push to main: regenerate catalog.json / INDEX.md / index.html / the README
# table, commit any changes, then publish the interactive catalog to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "*/SKILL.md"
      - "tools/**"
      - "README.md"
      - ".github/workflows/build-index.yml"
  pull_request:
    paths:
      - "*/SKILL.md"
      - "tools/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    # PRs: fail if frontmatter is invalid or quality checks don't pass.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill frontmatter
        run: python3 tools/build_index.py --validate

  build:
    # Pushes to main: regenerate and commit the catalog if anything changed.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate catalog
        run: python3 tools/build_index.py
      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain catalog.json INDEX.md README.md index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json INDEX.md README.md index.html
            git commit -m "chore: regenerate skills catalog [skip ci]"
            git push
          else
            echo "Catalog already up to date."
          fi

  deploy:
    # Publish the interactive catalog (index.html) to GitHub Pages.
    # Requires Pages enabled once: Settings → Pages → Source: GitHub Actions.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # pick up the freshly-regenerated catalog commit
      - name: Stage site (catalog + skills, excluding git internals)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
